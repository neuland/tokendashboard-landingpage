name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The decisions section is read from the backend repository at build time, so rebuild
  # daily to pick up changes there without a push here.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# Allow the job to read the repo and create a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Creates the Pages site for this repository if it does not exist yet, so the first
      # deployment does not depend on a manual click in Settings → Pages. On a plan that
      # does not offer Pages for private repositories this step fails with a clear message.
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Install, build and upload the site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
